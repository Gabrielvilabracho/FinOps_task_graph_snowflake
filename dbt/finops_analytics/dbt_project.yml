name: finops_analytics
version: 1.0.0
config-version: 2

profile: finops_analytics
require-dbt-version: [">=1.8.0", "<2.0.0"]

model-paths: ["models"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

models:
  finops_analytics:
    staging:
      +materialized: view
      +schema: finops_staging
    intermediate:
      +materialized: view
      +schema: finops_intermediate
    marts:
      +materialized: table
      +schema: finops_analytics
