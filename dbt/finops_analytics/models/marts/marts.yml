version: 2

models:
  - name: finops_daily_cost
    description: Daily account credits with both raw usage and billed credits kept explicit.
    columns:
      - name: analysis_date
        description: UTC usage date.
        data_tests: [not_null, unique]
      - name: raw_credits_used
        description: Raw credits before cloud-services adjustment; null for provisional, absent or incomplete evidence. Not currency.
      - name: billed_credits
        description: Credits after cloud-services adjustment; null for provisional, absent or incomplete evidence. Not payable currency.
      - name: evidence_reason
        description: Missing maturity, historical coverage, source rows or known values; null only for observed mature evidence.
      - name: source_first_usage_date
        description: Earliest observed source date; the first day cannot prove a complete historical population.
      - name: source_rows
        description: Observed daily service rows; zero means absent publication, not verified zero usage.
      - name: financial_basis
        description: Credits only; hourly, daily and service-detail representations must not be added together.
      - name: is_source_complete
        description: True after a local 48-hour reconciliation margin, earlier/later history and non-null observed rows. Not invoice reconciliation. Requires a UTC source session.
        data_tests: [not_null]

  - name: finops_warehouse_daily
    description: Daily descriptive warehouse usage; no anomaly threshold or policy status is applied.
    columns:
      - name: analysis_date
        description: UTC date derived from each metering hour.
        data_tests: [not_null]
      - name: warehouse_id
        description: Stable warehouse identifier.
        data_tests: [not_null]
      - name: warehouse_name
        description: Warehouse name observed in metering history; may be null when Account Usage publishes only the stable warehouse identifier.
      - name: raw_credits_used
        description: Warehouse credits before account-level cloud-services adjustment.
        data_tests: [not_null]
      - name: estimated_idle_credits
        description: Legacy nonnegative alias for compute residual; null when attribution is incomplete. Not proven waste or savings.
      - name: compute_residual_credits
        description: Signed compute less query-attributed compute; null when any compute or attribution value is absent. Provisional until source maturity.
      - name: attribution_state
        description: Observed row coverage only; Adaptive Warehouses can have unavailable attribution, not zero.
      - name: ownership_state
        description: UNKNOWN until effective-dated business ownership and allocation policy are supplied.
      - name: is_source_complete
        description: True only after the eight-hour query-attribution publication delay and a covering source watermark.
        data_tests: [not_null]

  - name: finops_query_performance_daily
    description: Daily query counts, duration buckets and raw-query percentiles by warehouse and query type; includes separate client-generated and user-query counts.
    columns:
      - name: analysis_date
        description: UTC query start date.
        data_tests: [not_null]
      - name: warehouse_key
        description: Stable warehouse identifier rendered as text, or NO_WAREHOUSE for statements that do not use a warehouse.
        data_tests: [not_null]
      - name: query_type
        description: Snowflake statement type; UNKNOWN remains explicit when supplied by the source.
      - name: query_count
        description: Number of source statements in the daily warehouse and query-type group.
        data_tests: [not_null]
      - name: p50_elapsed_time_ms
        description: Median total elapsed milliseconds computed from statement-level rows in this group.
      - name: p90_elapsed_time_ms
        description: 90th percentile total elapsed milliseconds computed from statement-level rows in this group.
      - name: p99_elapsed_time_ms
        description: 99th percentile total elapsed milliseconds computed from statement-level rows in this group.
      - name: is_source_complete
        description: True only after the documented 45-minute query-history boundary and a covering source watermark.
        data_tests: [not_null]

unit_tests:
  - name: daily_query_grain_survives_warehouse_rename_and_lowercase_status
    description: Keep one stable warehouse-id grain and treat lowercase Snowflake success status as successful.
    model: finops_query_performance_daily
    given:
      - input: ref('int_finops_query_history')
        rows:
          - {analysis_date: '2026-11-17', warehouse_id: 1, warehouse_name: OLD_NAME, query_type: SELECT, execution_status: success, end_time: '2026-11-17 01:00:01 +00:00', total_elapsed_time_ms: 1000, queued_provisioning_time_ms: 0, queued_repair_time_ms: 0, queued_overload_time_ms: 0, transaction_blocked_time_ms: 0, is_client_generated_statement: false}
          - {analysis_date: '2026-11-17', warehouse_id: 1, warehouse_name: NEW_NAME, query_type: SELECT, execution_status: success, end_time: '2026-11-17 02:00:02 +00:00', total_elapsed_time_ms: 2000, queued_provisioning_time_ms: 0, queued_repair_time_ms: 0, queued_overload_time_ms: 0, transaction_blocked_time_ms: 0, is_client_generated_statement: false}
    expect:
      rows:
        - {analysis_date: '2026-11-17', warehouse_key: '1', warehouse_id: 1, warehouse_name: NEW_NAME, query_type: SELECT, query_count: 2, client_generated_query_count: 0, user_query_count: 2, unsuccessful_query_count: 0, total_elapsed_time_ms: 3000, average_elapsed_time_ms: 1500, p50_elapsed_time_ms: 1500, p90_elapsed_time_ms: 1900, p99_elapsed_time_ms: 1990, total_queue_time_ms: 0, queries_le_1_second: 1, queries_1_to_5_seconds: 1, queries_5_to_30_seconds: 0, queries_30_to_60_seconds: 0, queries_1_to_5_minutes: 0, queries_gt_5_minutes: 0, source_rows: 2}

  - name: daily_cost_keeps_raw_and_billed_credits_distinct
    description: Preserve raw usage separately from account-level cloud-services adjustments.
    model: finops_daily_cost
    given:
      - input: ref('stg_account_usage__metering_daily_history')
        rows:
          - {usage_date: '2026-11-16', service_type: WAREHOUSE_METERING, credits_used_compute: 1.0, credits_used_cloud_services: 0.0, credits_used: 1.0, credits_adjustment_cloud_services: 0.0, credits_billed: 1.0}
          - {usage_date: '2026-11-17', service_type: WAREHOUSE_METERING, credits_used_compute: 10.0, credits_used_cloud_services: 0.0, credits_used: 10.0, credits_adjustment_cloud_services: 0.0, credits_billed: 10.0}
          - {usage_date: '2026-11-17', service_type: SERVERLESS_TASK, credits_used_compute: 2.0, credits_used_cloud_services: 1.0, credits_used: 3.0, credits_adjustment_cloud_services: -0.5, credits_billed: 2.5}
          - {usage_date: '2026-11-18', service_type: WAREHOUSE_METERING, credits_used_compute: 1.0, credits_used_cloud_services: 0.0, credits_used: 1.0, credits_adjustment_cloud_services: 0.0, credits_billed: 1.0}
      - input: ref('int_finops_date_spine')
        rows:
          - {analysis_date: '2026-11-17'}
    expect:
      rows:
        - {analysis_date: '2026-11-17', compute_credits: 12.0, cloud_services_credits: 1.0, raw_credits_used: 13.0, cloud_services_adjustment_credits: -0.5, billed_credits: 12.5, service_type_count: 2}

  - name: warehouse_idle_estimate_requires_complete_attribution
    description: Preserve null instead of inventing idle usage when query attribution is unavailable.
    model: finops_warehouse_daily
    given:
      - input: ref('stg_account_usage__warehouse_metering_history')
        rows:
          - {start_time: '2026-11-17 00:00:00 +00:00', end_time: '2026-11-17 01:00:00 +00:00', warehouse_id: 1, warehouse_name: COMPUTE_WH, credits_used: 2.0, credits_used_compute: 1.8, credits_used_cloud_services: 0.2, credits_attributed_compute_queries: 1.2}
          - {start_time: '2026-11-17 01:00:00 +00:00', end_time: '2026-11-17 02:00:00 +00:00', warehouse_id: 2, warehouse_name: ADAPTIVE_WH, credits_used: 1.0, credits_used_compute: 1.0, credits_used_cloud_services: 0.0, credits_attributed_compute_queries: null}
    expect:
      rows:
        - {analysis_date: '2026-11-17', warehouse_id: 1, warehouse_name: COMPUTE_WH, estimated_idle_credits: 0.6}
        - {analysis_date: '2026-11-17', warehouse_id: 2, warehouse_name: ADAPTIVE_WH, estimated_idle_credits: null}
