version: 2

models:
  - name: int_finops_date_spine
    description: One UTC analysis date for each of the previous 365 completed calendar days.
    columns:
      - name: analysis_date
        description: UTC date available for complete-versus-missing source evaluation.
        data_tests: [not_null, unique]

  - name: int_finops_query_history
    description: Durable statement-level query performance and optional compute attribution, incrementally reprocessing two days for late Account Usage publication.
    columns:
      - name: query_id
        description: Stable Snowflake statement identifier and incremental merge key.
        data_tests: [not_null, unique]
      - name: analysis_date
        description: UTC query start date used by daily, weekly and monthly marts.
        data_tests: [not_null]
      - name: attribution_state
        description: OBSERVED when attribution exists, PENDING inside the eight-hour publication window, otherwise UNAVAILABLE rather than zero.
        data_tests: [not_null]
      - name: is_query_history_complete
        description: True after the documented 45-minute query-history publication boundary.
        data_tests: [not_null]
      - name: is_attribution_window_complete
        description: True after the documented eight-hour query-attribution publication boundary; it does not imply attribution must exist.
        data_tests: [not_null]

  - name: int_finops_warehouse_state_intervals
    description: Resume-to-suspend lifecycle spans bounded by warehouse events; estimates operational span rather than exact metering or physical on-time.
    columns:
      - name: warehouse_id
        description: Stable warehouse identifier.
        data_tests: [not_null]
      - name: estimated_on_start
        description: RESUME_WAREHOUSE event timestamp used as the lower estimate boundary.
        data_tests: [not_null]
      - name: estimated_on_end
        description: Next SUSPEND_WAREHOUSE event timestamp used as the upper estimate boundary.
        data_tests: [not_null]
      - name: interval_evidence
        description: Constant EVENT_BOUNDED_ESTIMATE warning that the span is not exact billed or physical on-time.
        data_tests: [not_null]

  - name: int_finops_query_performance_periods
    description: Weekly and monthly query performance aggregated directly from durable statement rows, never from daily or lower-period percentiles.
    columns:
      - name: period_type
        description: WEEK or MONTH.
        data_tests: [not_null]
      - name: period_start_date
        description: Monday for ISO-style weeks or first calendar day for months.
        data_tests: [not_null]
      - name: p90_elapsed_time_ms
        description: 90th percentile computed from statement-level elapsed times in the complete period.
      - name: is_source_complete
        description: True only when retained history covers the period start and the source watermark covers its end.
        data_tests: [not_null]
