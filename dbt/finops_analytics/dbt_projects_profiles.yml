finops_analytics:
  target: prod
  outputs:
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      role: "{{ env_var('FINOPS_DBT_ROLE') }}"
      warehouse: "{{ env_var('FINOPS_DBT_WAREHOUSE') }}"
      database: "{{ env_var('FINOPS_DBT_DATABASE', 'FINOPS_DEV') }}"
      schema: "{{ env_var('FINOPS_DBT_SCHEMA', 'FINOPS') }}"
      threads: 8
